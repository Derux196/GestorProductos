spring.application.name=gestor-productos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
security.jwt.secret=${JWT_SECRET:dev-secret-key-32-bytes-long-not-for-prod}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
